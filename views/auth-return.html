<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Duck Epics — authorization</title>
  <style>body{font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;color:#172b4d;margin:24px}</style>
</head>
<body>
  <p id="m">Processing…</p>
  <script>
    (function () {
      var h = location.hash || '';
      var m = h.match(/token=([^&]+)/);
      var token = m ? decodeURIComponent(m[1]) : null;
      var el = document.getElementById('m');
      if (token && window.opener) {
        try { window.opener.postMessage({ duckToken: token }, '*'); } catch (e) {}
        el.textContent = 'Authorization successful. This window will close…';
        setTimeout(function () { window.close(); }, 700);
      } else if (token) {
        el.textContent = 'Token received. Copy and paste it into the plugin: ' + token;
      } else {
        el.textContent = 'No token received. Close this window and try again.';
      }
    })();
  </script>
</body>
</html>
