<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Keep the console clean (Trello review requires zero console output): silence benign noise
       from Trello's OWN client — its feature-gate init warning and the "Could not find iframe to
       resize" PostMessageIO rejection t.sizeTo() throws when the iframe is briefly detached. Only
       these exact, harmless messages are filtered; everything else passes through. -->
  <script>
    (function () {
      var NOISE = /feature gate|platform-dst-motion|Could not find iframe to resize|PostMessageIO|Client must be initialized/i;
      function txt(a) { try { return (a && a.message) ? a.message : (typeof a === 'object' ? JSON.stringify(a) : String(a)); } catch (e) { return ''; } }
      function wrap(orig) { return function () { try { if (NOISE.test(Array.prototype.map.call(arguments, txt).join(' '))) return; } catch (e) {} return orig.apply(this, arguments); }; }
      if (window.console) { console.warn = wrap(console.warn); console.error = wrap(console.error); }
      window.addEventListener('unhandledrejection', function (ev) { try { var r = ev && ev.reason; var m = r ? (r.message || String(r)) : ''; if (NOISE.test(String(m))) ev.preventDefault(); } catch (e) {} });
    })();
  </script>
  <link rel="stylesheet" href="https://p.trellocdn.com/power-up.min.css" />
  <link rel="stylesheet" href="../css/style.css?v=81" />
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script src="../js/lib.js?v=81"></script>
  <script src="./common.js?v=81"></script>
  <script src="./section.js?v=81"></script>
</body>
</html>
